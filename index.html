<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OwnX Progress</title>
  <meta name="description" content="What Own1, OwnXOS, Nexy and Earth Compute have shipped, and what comes next.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="eyebrow">OwnX · progress · updated <span id="updated"></span></span>
      <h1>Your AI, on hardware you <span class="serif">own</span>.</h1>
      <p id="intro"></p>
      <div class="facts" id="facts"></div>
    </header>

    <section aria-labelledby="new-title">
      <h2 id="new-title">What's new</h2>
      <ol class="news" id="news"></ol>
    </section>

    <section aria-labelledby="products-title">
      <div class="head">
        <h2 id="products-title">By product</h2>
        <div class="legend"><span class="st live">Live</span><span class="st prototype">Prototype</span><span class="st planned">Planned</span></div>
      </div>
      <div class="products" id="products"></div>
    </section>

    <section aria-labelledby="history-title">
      <h2 id="history-title">History</h2>
      <div class="history" id="history"></div>
    </section>

    <footer>OwnX · Own1 · OwnXOS · Nexy · Earth Compute</footer>
  </main>
</body>
</html>
